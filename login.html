 <h1 class="titulo-login">Área dos noivos - Login</h1>

<div class="login-container" id="loginDiv">
  <input type="text" id="usuario" placeholder="Usuário">
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="verificarLogin()">Entrar</button>
</div>

<div id="rsvpDiv" class="rsvp-container">
  <h2 class="titulo-rsvp">Lista de RSVPs</h2>
  <table id="rsvpTable">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Presença</th>
        <th>Acompanhantes</th>
        <th>Mensagem</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dados preenchidos via JS -->
    </tbody>
  </table>
</div>

<script>
  const usuarioCorreto = "luisa";
  const senhaCorreta = "luisa123";
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyuLXmplYCokZzXkTgeCSDL_1UA8M5qmtQK9BO7cxAAXiq_RKN-pHzNiDC2GmiL4NKg2g/exec";

  function verificarLogin() {
    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;

    if(usuario === usuarioCorreto && senha === senhaCorreta) {
      document.getElementById('loginDiv').style.display = "none";
      document.getElementById('rsvpDiv').style.display = "block";
      carregarRSVPs();
    } else {
      alert("Usuário ou senha incorretos!");
    }
  }

  function carregarRSVPs() {
    fetch(WEBAPP_URL)
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector("#rsvpTable tbody");
        tbody.innerHTML = "";
        data.forEach(item => {
          const tr = document.createElement("tr");
          // Ignorando a primeira coluna "data"
          tr.innerHTML = `
            <td>${item.nome}</td>
            <td>${item.email}</td>
            <td>${item.presenca}</td>
            <td>${item.acompanhantes}</td>
            <td>${item.mensagem}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => alert("Erro ao carregar RSVPs: " + err));
  }
</script>
