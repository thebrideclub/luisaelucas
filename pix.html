  <!-- Cabeçalho com logo -->
  <header class="menu">

      <img src="logo.png" alt="Logo" class="logo" />

    <nav class="nav-container">

      </ul>
    </nav>
  </header>

  <!-- Seção PIX -->
  <section class="pix-section">
    <h2 class="titulo-sessao">Presenteie com PIX</h2>
    <p class="descricao-sessao">Clique abaixo para copiar nossa chave PIX 💛</p>

    <a href="#" id="copiarPix" class="botao-pix">Copiar chave PIX</a>
    <span id="feedback" style="margin-left:8px;"></span>
  </section>

  <script>
    const link = document.getElementById("copiarPix");
    const fb = document.getElementById("feedback");
    const chave = "(21)98872-1170"; // 👉 coloque sua chave aqui

    link.addEventListener("click", async (e) => {
      e.preventDefault();
      try {
        await navigator.clipboard.writeText(chave);
        fb.textContent = "Copiado!";
      } catch {
        const area = document.createElement("textarea");
        area.value = chave;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        document.body.removeChild(area);
        fb.textContent = "Copiado!";
      }
      setTimeout(() => fb.textContent = "", 2000);
    });
  </script>
</body>
