<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSVP - Luisa & Lucas</title>

  <!-- 1) CSS global do site (menu, fontes, etc.) -->
  <link rel="stylesheet" href="style.css" />

  <!-- 2) CSS específico da página RSVP (não mexe no menu) -->
  <link rel="stylesheet" href="rsvp.css" />

  <link rel="icon" href="logo.png" type="image/png">
</head>
<body>

  <!-- Cabeçalho igual às outras páginas -->
  <header class="menu">
    <div class="logo-container">
      <img src="logo.png" alt="Logo" class="logo" />
    </div>

    <nav class="nav-container">
      <ul class="menu-list">
        <li><a href="index.html">CASAMENTO</a></li>
        <li><a href="dicas.html">DICAS</a></li>
        <li>
          <a href="https://ul.waze.com/ul?place=ChIJF-sY5_tHmAAR6LNQ-d4awaY&ll=-22.26580400%2C-42.93617680&navigate=yes&utm_campaign=default&utm_source=waze_website&utm_medium=lm_share_location" target="_blank">
            COMO CHEGAR
          </a>
        </li>
        <li><a href="rsvp.html">R.S.V.P</a></li>
        <li><a href="presentes.html">PRESENTES</a></li>
        <li><a href="mensagem.html">MENSAGEM</a></li>
      </ul>
    </nav>
  </header>

  <!-- Seção do RSVP -->
  <section class="rsvp-section">
    <div class="retangulo">
      <h2>Confirme sua presença</h2>

      <form id="rsvpForm" autocomplete="off">
        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>Whatsapp (DDD) + NÚMERO</label>
        <input type="tel" name="whatsapp" required>

        <label>Vai comparecer?</label>
        <select name="presenca" required>
          <option value="Sim">Sim</option>
          <option value="Não">Não</option>
        </select>

        <label>Número de acompanhantes</label>
        <input type="number" name="acompanhantes" min="0" value="0">

        <label>Mensagem</label>
        <textarea name="mensagem"></textarea>

        <button type="submit">ENVIAR</button>
      </form>
    </div>
  </section>

  <script>
    const form = document.getElementById('rsvpForm');

    form.addEventListener('submit', e => {
      e.preventDefault();

      fetch('https://script.google.com/macros/s/AKfycbx9Tmo_UrEm_8oc0YvwZ6X1VvdN75KNVG-7O1MsuhkiVvitQ4_Nqi_n6sda9phVYU9Y/exec', {
        method: 'POST',
        body: new FormData(form)
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === 'success') {
          alert('RSVP enviado com sucesso!');
          form.reset();
        } else {
          alert('Ocorreu um erro, tente novamente.');
        }
      })
      .catch(err => alert('Erro: ' + err));
    });
  </script>

</body>
</html>
